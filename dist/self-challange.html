<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="./assets/images/logo.png"
      type="image/x-icon"
    />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="manifest" href="./manifest.json" />
    <title>Self Challenge - Quizio PWA HTML Template</title>
  <link href="style.css" rel="stylesheet"></head>
  <body class="relative -z-20">
    <div
      class="container min-h-dvh relative overflow-hidden py-8 dark:text-white -z-10 dark:bg-color1"
    >
      <!-- Absolute Items Start -->
      <img
        src="./assets/images/header-bg-2.png"
        alt=""
        class="absolute top-0 left-0 right-0 -mt-32"
      />
      <div
        class="absolute top-0 left-0 bg-p3 blur-[145px] h-[174px] w-[149px]"
      ></div>
      <div
        class="absolute top-40 right-0 bg-[#0ABAC9] blur-[150px] h-[174px] w-[91px]"
      ></div>
      <div
        class="absolute top-80 right-40 bg-p2 blur-[235px] h-[205px] w-[176px]"
      ></div>
      <div
        class="absolute bottom-0 right-0 bg-p3 blur-[220px] h-[174px] w-[149px]"
      ></div>
      <!-- Absolute Items End -->

      <!-- Page Title Start -->
      <div class="relative z-50 px-6">
        <div class="flex justify-between items-center gap-4">
          <div class="flex justify-start items-center gap-4">
            <a
              class="bg-white size-8 rounded-full flex justify-center items-center text-xl dark:bg-color10"
            >
              <i class="ph ph-caret-left"></i>
            </a>
            <h2 class="text-2xl font-semibold text-white">Self Challenge</h2>
          </div>
        </div>
        <div class="pt-32 flex flex-col gap-5">
          <div class="">
            <p class="text-sm font-semibold pb-2">Select Category</p>
            <div
              class="flex justify-between items-center py-3 px-4 border border-color21 rounded-xl dark:border-color18 bg-white category relative cursor-pointer"
            >
              <span class="text-n600 text-sm dark:text-color18 sortByText"
                >Category</span
              >

              <i class="ph ph-caret-down text-xl !leading-none"></i>

              <div
                class="absolute top-11 right-0 bg-p1 rounded-xl p-4 w-full z-50 text-base duration-700 text-white modalClose text-nowrap"
                id="categoryModal"
              >
                <ul class="flex justify-start items-start flex-col gap-3">
                  <li class="dropdownItem cursor-pointer">Item One</li>
                  <li class="dropdownItem cursor-pointer">Item Two</li>
                  <li class="dropdownItem cursor-pointer">Item Three</li>
                </ul>
              </div>
            </div>
          </div>
          <div class="">
            <p class="text-sm font-semibold pb-2">Select Sub Category</p>
            <div
              class="flex justify-between items-center py-3 px-4 border border-color21 rounded-xl dark:border-color18 bg-white category2 relative cursor-pointer"
            >
              <span class="text-n600 text-sm dark:text-color18 sortByText2"
                >Sub Category</span
              >

              <i class="ph ph-caret-down text-xl !leading-none"></i>

              <div
                class="absolute top-11 right-0 bg-p1 rounded-xl p-4 w-full z-50 text-base duration-700 text-white modalClose text-nowrap"
                id="category2Modal"
              >
                <ul class="flex justify-start items-start flex-col gap-3">
                  <li class="dropdownItem2 cursor-pointer">Item One</li>
                  <li class="dropdownItem2 cursor-pointer">Item Two</li>
                  <li class="dropdownItem2 cursor-pointer">Item Three</li>
                </ul>
              </div>
            </div>
          </div>

          <div class="p-5 rounded-xl bg-white">
            <p class="text-sm font-semibold pb-2">Select Category</p>
            <div class="flex justify-start items-center gap-5 select-question">
              <div class="item">1</div>
              <div class="item active">2</div>
              <div class="item">3</div>
              <div class="item">4</div>
              <div class="item">5</div>
            </div>
          </div>
          <div class="p-5 rounded-xl bg-white">
            <p class="text-sm font-semibold pb-2">Select Duration</p>
            <div class="flex justify-start items-center gap-5 select-duration">
              <div class="item">2m</div>
              <div class="item active">4m</div>
              <div class="item">5m</div>
              <div class="item">8m</div>
              <div class="item">9m</div>
            </div>
          </div>
          <div class="">
            <a
              href="./home.html"
              class="bg-p2 rounded-full py-3 text-white text-sm font-semibold text-center block mt-12 dark:bg-p1"
              >Let's Start</a
            >
          </div>
        </div>
      </div>
    </div>

    <!-- Javascript Dependencies -->
    <script src="./assets/js/main.js"></script>
  <script defer src="index.js"></script></body>
</html>
