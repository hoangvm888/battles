<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="./assets/images/logo.png"
      type="image/x-icon"
    />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="manifest" href="./manifest.json" />
    <title>Waiting For Players - Quizio PWA HTML Template</title>
  </head>
  <body class="">
    <div
      class="container min-h-dvh relative overflow-hidden py-8 dark:text-white dark:bg-color1"
    >
      <!-- Absolute Items Start -->

      <div
        class="absolute top-0 left-0 bg-p3 blur-[145px] h-[174px] w-[149px]"
      ></div>
      <div
        class="absolute top-40 right-0 bg-[#0ABAC9] blur-[150px] h-[174px] w-[91px]"
      ></div>
      <div
        class="absolute top-80 right-40 bg-p2 blur-[235px] h-[205px] w-[176px]"
      ></div>
      <div
        class="absolute bottom-0 right-0 bg-p3 blur-[220px] h-[174px] w-[149px]"
      ></div>
      <!-- Absolute Items End -->

      <!-- Page Title Start -->
      <div class="relative z-10">
        <div class="flex justify-between items-center gap-4 px-6">
          <div class="flex justify-start items-center gap-4">
            <a
              class="bg-p2 text-white p-1 rounded-full flex justify-center items-center text-xl dark:bg-p1"
            >
              <i class="ph ph-caret-left"></i>
            </a>
            <h2 class="text-2xl font-semibold">Waiting for Players</h2>
          </div>
        </div>

        <div class="p-5 border border-color21 bg-white rounded-2xl mt-8 mx-6">
          <img src="./assets/images/waiting-for-player-img.png" alt="" />
          <p
            class="font-semibold text-center pb-3 border-b border-color21 dark:border-color24 border-dashed"
          >
            Engaging Quizzes for
          </p>
          <p class="text-xs text-color5 pt-3 text-center">Aiden Gray</p>
        </div>

        <div class="pt-8">
          <img src="./assets/images/waiting-slider.png" alt="" />
        </div>
        <div class="flex justify-center items-center relative pt-12">
          <div
            class="relative size-20 flex justify-center items-center text-center"
          >
            <img
              src="./assets/images/waiting-rotate.png"
              alt=""
              class="absolute top-0 left-0 circle"
            />
            <p class="text-lg font-bold text-p2">20</p>
          </div>
        </div>
      </div>
    </div>
    <!-- ==== js dependencies start ==== -->
    <script src="./assets/js/main.js"></script>
  </body>
</html>
